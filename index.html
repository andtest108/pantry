<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Pantry Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
    #reader { width: 100%; max-width: 450px; margin: 0 auto; min-height: 250px; background: #000; border-radius: 12px; overflow: hidden; }
    .product-img { width: 48px; height: 48px; object-fit: cover; border-radius: 6px; }
    .preview-img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 2px dashed #0d6efd; }
    .scan-mode-btn { font-weight: bold; }
  </style>
</head>
<body class="p-2 p-md-3">

<div class="container-fluid max-width-lg">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="m-0"><i class="bi bi-box-seam text-primary"></i> Pantry Manager</h3>
    <div id="storageBadge" class="badge bg-info text-dark"><i class="bi bi-hdd"></i> Local Storage</div>
  </div>

  <!-- Navigation Tabs -->
  <ul class="nav nav-pills nav-fill mb-3" id="pantryTabs">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#scan-tab"><i class="bi bi-qr-code-scan"></i> Scan</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#inventory-tab" onclick="renderInventory()"><i class="bi bi-list-check"></i> Απόθεμα</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#shopping-tab" onclick="renderShoppingList()"><i class="bi bi-cart3"></i> Αγορές</button>
    </li>
  </ul>

  <div class="tab-content">
    <!-- TAB 1: SCANNER & FORM -->
    <div class="tab-pane fade show active" id="scan-tab">
      
      <!-- Scan Mode Selector -->
      <div class="card shadow-sm p-3 mb-3 text-center">
        <label class="form-label fw-bold mb-2">Επιλογή Λειτουργίας Σκαναρίσματος:</label>
        <div class="btn-group w-100" role="group">
          <input type="radio" class="btn-check" name="scanMode" id="modeCheckIn" value="checkin" checked>
          <label class="btn btn-outline-success scan-mode-btn" for="modeCheckIn"><i class="bi bi-plus-circle"></i> Check-In (Προσθήκη)</label>

          <input type="radio" class="btn-check" name="scanMode" id="modeCheckOut" value="checkout">
          <label class="btn btn-outline-danger scan-mode-btn" for="modeCheckOut"><i class="bi bi-dash-circle"></i> Check-Out (Αφαίρεση)</label>
        </div>
      </div>

      <div class="card shadow-sm p-3 mb-3">
        <div class="d-grid gap-2 mb-2">
          <button class="btn btn-primary" onclick="startCamera()"><i class="bi bi-camera"></i> Άνοιγμα Scanner Barcode</button>
          <button class="btn btn-outline-secondary btn-sm" onclick="stopCamera()" id="btnStopCam" style="display:none;">Κλείσιμο Scanner</button>
        </div>
        <div id="reader"></div>

        <hr class="my-3">
        <label class="form-label small text-muted">Χειροκίνητο Barcode (EAN):</label>
        <div class="input-group">
          <input type="number" id="manualBarcode" class="form-control" placeholder="π.χ. 5449000000996">
          <button class="btn btn-secondary" onclick="processBarcode(document.getElementById('manualBarcode').value)">Αναζήτηση</button>
        </div>
      </div>

      <!-- Product Details Form -->
      <div class="card shadow-sm p-3" id="formCard">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="card-title m-0">Στοιχεία Προϊόντος</h6>
          <button class="btn btn-sm btn-outline-danger" onclick="resetForm()"><i class="bi bi-x-circle"></i> Καθαρισμός</button>
        </div>
        
        <form id="productForm" onsubmit="saveProductForm(event)">
          <div class="mb-2">
            <label class="form-label small">Barcode</label>
            <input type="text" id="p_barcode" class="form-control" required readonly placeholder="Σκανάρετε ένα barcode...">
          </div>
          <div class="mb-2">
            <label class="form-label small">Όνομα Προϊόντος</label>
            <input type="text" id="p_name" class="form-control" required placeholder="Όνομα προϊόντος">
          </div>

          <!-- Photo Capture Section -->
          <div class="mb-3">
            <label class="form-label small d-block">Φωτογραφία Προϊόντος</label>
            <div class="d-flex align-items-center gap-3">
              <input type="file" id="p_photo_input" accept="image/*" capture="environment" style="display:none" onchange="handlePhotoCapture(event)">
              <button type="button" class="btn btn-outline-primary btn-sm" onclick="document.getElementById('p_photo_input').click()">
                <i class="bi bi-camera-fill"></i> Λήψη Φωτογραφίας
              </button>
              <img id="p_preview" src="https://via.placeholder.com/80?text=No+Image" class="preview-img">
            </div>
          </div>

          <div class="row g-2 mb-2">
            <div class="col">
              <label class="form-label small">Κατηγορία</label>
              <select id="p_category" class="form-select">
                <option>Γαλακτοκομικά</option>
                <option>Κονσέρβες</option>
                <option>Ζυμαρικά / Δημητριακά</option>
                <option>Κατάψυξη</option>
                <option>Αναψυκτικά / Ποτά</option>
                <option>Λοιπά</option>
              </select>
            </div>
            <div class="col">
              <label class="form-label small">Τοποθεσία</label>
              <select id="p_location" class="form-select">
                <option>Ψυγείο</option>
                <option>Ντουλάπι 1</option>
                <option>Ντουλάπι 2</option>
                <option>Κατάψυξη</option>
              </select>
            </div>
          </div>
          <div class="row g-2 mb-2">
            <div class="col">
              <label class="form-label small">Ποσότητα</label>
              <input type="number" id="p_qty" class="form-control" value="1" min="1" required>
            </div>
            <div class="col">
              <label class="form-label small">Ελάχιστο Όριο</label>
              <input type="number" id="p_min_qty" class="form-control" value="1" min="1" required>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label small">Ημερομηνία Λήξης</label>
            <input type="date" id="p_expiry" class="form-control">
          </div>
          <input type="hidden" id="p_image">
          <button type="submit" class="btn btn-success w-100"><i class="bi bi-check-lg"></i> Αποθήκευση στο Απόθεμα</button>
        </form>
      </div>
    </div>

    <!-- TAB 2: INVENTORY -->
    <div class="tab-pane fade" id="inventory-tab">
      <div class="card shadow-sm p-2 mb-2">
        <input type="text" id="searchInput" class="form-control mb-2" placeholder="Αναζήτηση..." oninput="renderInventory()">
        <select id="filterCategory" class="form-select" onchange="renderInventory()">
          <option value="">Όλες οι Κατηγορίες</option>
          <option>Γαλακτοκομικά</option>
          <option>Κονσέρβες</option>
          <option>Ζυμαρικά / Δημητριακά</option>
          <option>Κατάψυξη</option>
          <option>Αναψυκτικά / Ποτά</option>
          <option>Λοιπά</option>
        </select>
      </div>
      <div id="inventoryCards"></div>
    </div>

    <!-- TAB 3: SHOPPING LIST -->
    <div class="tab-pane fade" id="shopping-tab">
      <div class="card shadow-sm p-3">
        <h6 class="card-title text-danger mb-3"><i class="bi bi-cart-check"></i> Προϊόντα για Αγορά (Ελλείψεις)</h6>
        <ul class="list-group" id="shoppingList"></ul>
      </div>
    </div>
  </div>
</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
  // --- 1. FIREBASE CONFIGURATION ---
  const firebaseConfig = {
    apiKey: "AIzaSyALm4dQG2MdbtcF6M7E-OOLLgmu1mZyMto",
    authDomain: "pantryweb-45b7b.firebaseapp.com",
    projectId: "pantryweb-45b7b",
    storageBucket: "pantryweb-45b7b.firebasestorage.app",
    messagingSenderId: "968413726562",
    appId: "1:968413726562:web:ec93b9793d773e813d4e3b",
    measurementId: "G-4HX7BE69CH"
  };

  let db = null;
  let useFirebase = false;

  try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
    useFirebase = true;
    document.getElementById('storageBadge').className = 'badge bg-success';
    document.getElementById('storageBadge').innerHTML = '<i class="bi bi-cloud-check"></i> Cloud Storage';
  } catch(e) { 
    console.warn("Firebase config error. Falling back to LocalStorage.", e); 
  }

  let html5QrCode = null;

  function getLocalData(key) { return JSON.parse(localStorage.getItem(key) || '[]'); }
  function setLocalData(key, data) { localStorage.setItem(key, JSON.stringify(data)); }

  window.onload = function() {
    if (useFirebase) {
      db.collection("pantry").onSnapshot((snapshot) => {
        let pantry = [];
        snapshot.forEach(doc => pantry.push({ id: doc.id, ...doc.data() }));
        setLocalData('pantry_data', pantry);
        renderInventory();
        renderShoppingList();
      }, (err) => {
        console.error("Firebase Listener Error:", err);
        renderInventory();
        renderShoppingList();
      });
    } else {
      renderInventory();
      renderShoppingList();
    }
  };

  // --- 2. CAMERA & SCANNER ---
  function startCamera() {
    if(!html5QrCode) html5QrCode = new Html5Qrcode("reader");
    document.getElementById('btnStopCam').style.display = 'block';
    
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 15, qrbox: { width: 250, height: 150 } },
      (decodedText) => {
        stopCamera();
        processBarcode(decodedText);
      },
      (err) => {}
    ).catch(err => alert("Δώστε άδεια πρόσβασης στην κάμερα."));
  }

  function stopCamera() {
    if(html5QrCode && html5QrCode.isScanning) {
      html5QrCode.stop().then(() => {
        document.getElementById('btnStopCam').style.display = 'none';
      });
    }
  }

  function resetForm() {
    document.getElementById('p_barcode').value = '';
    document.getElementById('p_name').value = '';
    document.getElementById('p_qty').value = 1;
    document.getElementById('p_min_qty').value = 1;
    document.getElementById('p_expiry').value = '';
    document.getElementById('p_image').value = '';
    document.getElementById('p_preview').src = 'https://via.placeholder.com/80?text=No+Image';
  }

  // --- 3. PHOTO CAPTURE ENGINE ---
  function handlePhotoCapture(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(event) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const maxDim = 350;
        let width = img.width, height = img.height;

        if (width > height) {
          if (width > maxDim) { height *= maxDim / width; width = maxDim; }
        } else {
          if (height > maxDim) { width *= maxDim / height; height = maxDim; }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const base64Image = canvas.toDataURL('image/jpeg', 0.6);
        document.getElementById('p_image').value = base64Image;
        document.getElementById('p_preview').src = base64Image;
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  // --- 4. BARCODE PROCESSING ENGINE ---
  async function processBarcode(barcode) {
    if (!barcode) return;
    const mode = document.querySelector('input[name="scanMode"]:checked').value;

    if (mode === 'checkout') {
      await handleCheckOut(barcode);
    } else {
      await handleCheckIn(barcode);
    }
  }

  async function handleCheckOut(barcode) {
    const pantry = getLocalData('pantry_data');
    const existing = pantry.find(p => p.barcode === barcode);
    if (!existing) {
      alert("Το προϊόν δεν βρέθηκε στο απόθεμά σας!");
      return;
    }

    if (existing.qty > 1) {
      existing.qty -= 1;
      if (useFirebase && existing.id) {
        await db.collection("pantry").doc(existing.id).update({ qty: existing.qty });
      } else {
        setLocalData('pantry_data', pantry);
        renderInventory();
      }
      alert(`Αφαιρέθηκε 1 τεμάχιο από: ${existing.name}. Νέο υπόλοιπο: ${existing.qty}`);
    } else {
      if (confirm(`Το προϊόν "${existing.name}" έφτασε στο 0. Θέλετε να το διαγράψετε από το απόθεμα;`)) {
        if (useFirebase && existing.id) {
          await db.collection("pantry").doc(existing.id).delete();
        } else {
          const idx = pantry.findIndex(p => p.barcode === barcode);
          pantry.splice(idx, 1);
          setLocalData('pantry_data', pantry);
          renderInventory();
        }
      }
    }
  }

  async function handleCheckIn(barcode) {
    resetForm();
    document.getElementById('p_barcode').value = barcode;
    document.getElementById('p_name').placeholder = "Αναζήτηση στο API...";

    const pantry = getLocalData('pantry_data');
    const customList = getLocalData('custom_products');

    // 1. Check current Pantry
    const existingInPantry = pantry.find(p => p.barcode === barcode);
    if (existingInPantry) {
      populateForm(existingInPantry);
      return;
    }

    // 2. Check Custom Learned Products (Local or Cloud)
    const customLocal = customList.find(c => c.barcode === barcode);
    if (customLocal) {
      populateForm(customLocal);
      return;
    }

    if (useFirebase) {
      try {
        const customDoc = await db.collection("custom_products").doc(barcode).get();
        if (customDoc.exists) {
          populateForm({ barcode, ...customDoc.data() });
          return;
        }
      } catch(e) { console.error("Firestore lookup error", e); }
    }

    // 3. Open Food Facts API Search with Fallback Domains
    let found = false;
    const apiUrls = [
      `https://world.openfoodfacts.org/api/v0/product/${barcode}.json`,
      `https://el.openfoodfacts.org/api/v0/product/${barcode}.json`
    ];

    for (let url of apiUrls) {
      if (found) break;
      try {
        const res = await fetch(url, { headers: { 'User-Agent': 'SmartPantryManagerApp - Web - Version 1.0' } });
        const data = await res.json();
        
        if (data.status === 1 && data.product) {
          const prod = data.product;
          const name = prod.product_name_el || prod.product_name || prod.generic_name_el || prod.generic_name || prod.product_name_en || '';
          const img = prod.image_front_small_url || prod.image_url || prod.image_front_url || '';

          if (name) {
            document.getElementById('p_name').value = name;
            document.getElementById('p_image').value = img;
            document.getElementById('p_preview').src = img || 'https://via.placeholder.com/80?text=No+Image';
            document.getElementById('p_qty').value = 1;
            found = true;
          }
        }
      } catch(e) { console.error("API error:", e); }
    }

    if (!found) {
      document.getElementById('p_name').placeholder = "Όνομα προϊόντος (Πληκτρολογήστε το)";
      alert('Το προϊόν δεν υπάρχει στη διεθνή βάση. Πληκτρολογήστε το όνομά του και βγάλτε μια φωτογραφία — η εφαρμογή θα το "μάθει" για πάντα!');
      document.getElementById('p_name').focus();
    }
  }

  function populateForm(data) {
    document.getElementById('p_name').value = data.name || '';
    document.getElementById('p_category').value = data.category || 'Γαλακτοκομικά';
    document.getElementById('p_location').value = data.location || 'Ψυγείο';
    document.getElementById('p_qty').value = data.qty || 1;
    document.getElementById('p_min_qty').value = data.min_qty || 1;
    document.getElementById('p_expiry').value = data.expiry || '';
    document.getElementById('p_image').value = data.image || '';
    document.getElementById('p_preview').src = data.image || 'https://via.placeholder.com/80?text=No+Image';
  }

  // --- 5. SAVE & LEARN ENGINE ---
  async function saveProductForm(e) {
    e.preventDefault();
    const barcode = document.getElementById('p_barcode').value;
    const name = document.getElementById('p_name').value;
    const category = document.getElementById('p_category').value;
    const location = document.getElementById('p_location').value;
    const qty = parseInt(document.getElementById('p_qty').value);
    const min_qty = parseInt(document.getElementById('p_min_qty').value);
    const expiry = document.getElementById('p_expiry').value;
    const image = document.getElementById('p_image').value || 'https://via.placeholder.com/80?text=No+Image';

    if (!barcode) { alert("Παρακαλώ σκανάρετε ή εισάγετε ένα Barcode."); return; }

    const prodData = { barcode, name, category, location, qty, min_qty, expiry, image, updatedAt: new Date().toISOString() };

    // Save to LocalStorage
    const pantry = getLocalData('pantry_data');
    const existingIdx = pantry.findIndex(p => p.barcode === barcode);
    if (existingIdx >= 0) { pantry[existingIdx] = prodData; } else { pantry.push(prodData); }
    setLocalData('pantry_data', pantry);

    // Save to Custom Learned Products
    const customList = getLocalData('custom_products');
    const cIdx = customList.findIndex(c => c.barcode === barcode);
    const customItem = { barcode, name, category, location, image };
    if (cIdx >= 0) customList[cIdx] = customItem; else customList.push(customItem);
    setLocalData('custom_products', customList);

    // Save to Firebase Cloud
    if (useFirebase) {
      try {
        if (existingIdx >= 0 && pantry[existingIdx].id) {
          await db.collection("pantry").doc(pantry[existingIdx].id).set(prodData);
        } else {
          await db.collection("pantry").add(prodData);
        }
        await db.collection("custom_products").doc(barcode).set(customItem);
      } catch(err) { console.error("Firebase write error:", err); }
    }

    alert('Το προϊόν αποθηκεύτηκε στο Cloud!');
    resetForm();
    renderInventory();
  }

  // --- 6. RENDER FUNCTIONS ---
  function renderInventory() {
    const pantry = getLocalData('pantry_data');
    const search = (document.getElementById('searchInput')?.value || '').toLowerCase();
    const cat = document.getElementById('filterCategory')?.value || '';
    const container = document.getElementById('inventoryCards');
    if (!container) return;
    container.innerHTML = '';

    pantry
      .filter(p => p.name.toLowerCase().includes(search) && (cat === '' || p.category === cat))
      .forEach((p, idx) => {
        const card = document.createElement('div');
        card.className = 'card mb-2 shadow-sm p-2';
        card.innerHTML = `
          <div class="d-flex align-items-center justify-content-between">
            <div class="d-flex align-items-center">
              <img src="${p.image}" class="product-img me-2">
              <div>
                <strong>${p.name}</strong><br>
                <small class="text-muted">${p.category} | ${p.location}</small>
              </div>
            </div>
            <div class="text-end">
              <div>
                <button class="btn btn-sm btn-outline-danger py-0 px-2" onclick="changeQty(${idx}, -1)">-</button>
                <span class="fw-bold mx-1">${p.qty}</span>
                <button class="btn btn-sm btn-outline-success py-0 px-2" onclick="changeQty(${idx}, 1)">+</button>
              </div>
              <button class="btn btn-sm btn-link text-danger p-0 mt-1" onclick="deleteProd(${idx})"><i class="bi bi-trash"></i></button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
  }

  function changeQty(idx, change) {
    const pantry = getLocalData('pantry_data');
    pantry[idx].qty += change;
    if (pantry[idx].qty <= 0) {
      pantry.splice(idx, 1);
    }
    setLocalData('pantry_data', pantry);
    renderInventory();
  }

  function deleteProd(idx) {
    if (confirm("Διαγραφή προϊόντος από το απόθεμα;")) {
      const pantry = getLocalData('pantry_data');
      pantry.splice(idx, 1);
      setLocalData('pantry_data', pantry);
      renderInventory();
    }
  }

  function renderShoppingList() {
    const pantry = getLocalData('pantry_data');
    const ul = document.getElementById('shoppingList');
    if (!ul) return;
    ul.innerHTML = '';
    pantry.filter(p => p.qty <= p.min_qty).forEach(p => {
      const li = document.createElement('li');
      li.className = 'list-group-item d-flex justify-content-between align-items-center';
      li.innerHTML = `<div><strong>${p.name}</strong><br><small class="text-muted">Υπόλοιπο: ${p.qty}</small></div><span class="badge bg-danger">Όριο: ${p.min_qty}</span>`;
      ul.appendChild(li);
    });
  }
</script>
</body>
</html>
